[pytest]
pythonpath = .
asyncio_mode = auto
markers = 
    unit_generate_hash: marca testes unitários de gerador de hash
    unit_verify_password: marca teste unitários de verficar senha
    unit_create_token: marca teste unitário de criar token JWT
    integration: marca testes de integração
    integration_duplicate_email: marca teste de integração com levantamento de exceção de e-mail duplicado
    unit_invalid_secret: marca teste de chave secreta inválida
    unit_authenticate_user: marca teste de autenticação de usuário